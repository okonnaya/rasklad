server {
    listen 80;
    listen [::]:80;
    server_name raskladik.com www.raskladik.com;
    return 301 https://raskladik.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raskladik.com www.raskladik.com;

    ssl_certificate /etc/nginx/ssl/raskladik.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/raskladik.com/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.raskladik.com) {
        return 301 https://raskladik.com$request_uri;
    }

    root /var/www/rasklad/current;
    index index.html;
    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Only original client URLs redirect; internal .html resolution never loops.
    if ($request_uri ~ "^/index\.html(?:\?|$)") {
        return 301 https://raskladik.com/$is_args$args;
    }
    if ($request_uri ~ "^/(?!yandex_8174516e8ad894de\.html)(.+)\.html(?:\?|$)") {
        return 301 https://raskladik.com/$1$is_args$args;
    }

    location = /cardoftheday { return 301 /fortunetellings/cardoftheday$is_args$args; }
    location = /articles/article { return 301 /articles$is_args$args; }
    location = /cards/ { return 301 /cards$is_args$args; }
    location = /articles/ { return 301 /articles$is_args$args; }
    location = /fortunetellings/ { return 301 /fortunetellings$is_args$args; }

    # Keep the ownership-verification filename exactly as Yandex expects it.
    location = /yandex_8174516e8ad894de.html { try_files $uri =404; }

    # Resolve clean URLs to built HTML, retaining real 404s for missing pages.
    location / { try_files $uri.html $uri $uri/ =404; }
    location ~ /\. { deny all; }

    # Build assets include content hashes; reuse them between page visits.
    location ~ ^/(assets|images|fonts)/ {
        try_files $uri @previous_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # An already open page can still request a chunk from the previous release.
    location @previous_assets {
        root /var/www/rasklad/previous;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # HTML and stable public filenames must revalidate after a deployment.
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
