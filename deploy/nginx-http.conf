# Bootstrap configuration while domain ownership and HTTPS are being activated.
server {
    listen 80;
    listen [::]:80;
    server_name raskladik.com www.raskladik.com;
    root /var/www/rasklad/current;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
}
