name: Import Airtable content

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run db:import
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID || 'appcttjzPgvmm4Gdx' }}
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: rasklad-content
          path: |
            database/rasklad.sqlite3
            src/data/
            docs/
