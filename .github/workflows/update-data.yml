name: Import Airtable content

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run db:import
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID || 'appcttjzPgvmm4Gdx' }}
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: rasklad-content
          path: |
            database/rasklad.sqlite3
            src/data/
            docs/
